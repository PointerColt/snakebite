<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Run</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="layout-wrapper">
      <div class="main-content">
        <div>
          <div class="score-card">
            <div class="game-name">Snake hunt</div>
            <div class="score-card-item">
              <div class="text">Score</div>
              <div class="number">0</div>
            </div>
            <div class="score-card-item">
              <div class="text">Best Score</div>
              <div class="number">0</div>
            </div>
          </div>

          <div class="grid-box"></div>
        </div>

        <div class="navigation">
          <button id="nav-btn">Start</button>
          <button id="pause-btn" hidden>Pause</button>
        </div>

        <dialog id="game-over-dialog">
          <div class="game-over-card">
            <h2>Game Over</h2>

            <div class="score-card-item">
              <span>Score</span>
              <span id="final-score">0</span>
            </div>

            <div class="score-card-item">
              <span>Best Score</span>
              <span id="final-best-score">0</span>
            </div>

            <button id="play-again-btn">Play Again</button>
          </div>
        </dialog>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
